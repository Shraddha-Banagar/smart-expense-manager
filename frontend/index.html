<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Upload receipts, let AI extract your expenses, and understand where your money goes." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 22V10h7a4 4 0 0 1 0 8h-4' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Smart Expense Manager</title>
    <script>
      // Apply the saved theme before first paint so dark-mode users don't see a
      // flash of the light theme while React boots. (Keep in sync with ThemeContext.)
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
